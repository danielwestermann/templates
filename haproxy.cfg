global
	log /dev/log	local0
	log /dev/log	local1 notice
	chroot /var/lib/haproxy
	#stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
	stats timeout 30s
	user haproxy
	group haproxy
	daemon
    ca-file /etc/pki/patroni/ca.crt

defaults
	log	global
	option  tcplog
	mode	tcp
	retries 2
	timeout client 30m
	timeout connect 5s
	timeout server 30m
	timeout check 5s

listen stats
	mode http
	bind *:7000
	stats enable
	stats uri /

listen pg-ha-primary
	bind 0.0.0.0:5000
	option httpchk OPTIONS /primary
	http-check expect status 200
	default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
	server [NODE1] [IP1]:5432 check port 8008 check-ssl ca-file /etc/pki/patroni/ca.crt
	server [NODE2] [IP2]:5432 check port 8008 check-ssl ca-file /etc/pki/patroni/ca.crt
	server [NODE3] [IP3]:5432 check port 8008 check-ssl ca-file /etc/pki/patroni/ca.crt

listen pg-ha-replica
	bind 0.0.0.0:5001
	option httpchk OPTIONS /replica
	http-check expect status 200
	balance roundrobin
	default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
        server [NODE1] [IP1]:5432 check port 8008 check-ssl ca-file /etc/pki/patroni/ca.crt
        server [NODE2] [IP2]:5432 check port 8008 check-ssl ca-file /etc/pki/patroni/ca.crt
        server [NODE3] [IP3]:5432 check port 8008 check-ssl ca-file /etc/pki/patroni/ca.crt

listen pg-ha-replica-or-primary
	bind 0.0.0.0:5432
	acl is-read-service-dead nbsrv(pg-ha-replica) lt 1
	use_backend pg-ha-primary if is-read-service-dead
	default_backend pg-ha-replica
